<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="252" viewBox="0 0 1000 252" role="img" aria-label="Yameen Bux — Senior IT Infrastructure Engineer. Cloud and DevOps: production systems, shipped and running. Cloudflare Workers, GitHub Actions, PowerShell, Microsoft 365.">
  <title>Yameen Bux — Senior IT Infrastructure Engineer. Cloud and DevOps: production systems, shipped and running. Cloudflare Workers, GitHub Actions, PowerShell, Microsoft 365.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F6F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0969DA"/><stop offset="1" stop-color="#1293AC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0969DA" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#0969DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fademask"><rect x="640" y="0" width="360" height="252" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="0.5" y="0.5" width="999" height="251" rx="14"/></clipPath>
  </defs>
  <style>
    @keyframes rise{from{opacity:0;transform:translateY(var(--d))}to{opacity:1;transform:translateY(0)}}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes draw{from{clip-path:inset(100% 0 0 0)}to{clip-path:inset(0 0 0 0)}}
    @keyframes sweep{from{stroke-dashoffset:0}to{stroke-dashoffset:-615.8}}
    @keyframes pk0{0%{opacity:0;transform:translate(0,0)}14%{opacity:.95}78%{opacity:.95}100%{opacity:0;transform:translate(-104px,-56px)}}
    @keyframes pk1{0%{opacity:0;transform:translate(0,0)}14%{opacity:.95}78%{opacity:.95}100%{opacity:0;transform:translate(82px,-68px)}}
    @keyframes pk2{0%{opacity:0;transform:translate(0,0)}14%{opacity:.95}78%{opacity:.95}100%{opacity:0;transform:translate(24px,86px)}}
    @keyframes pk3{0%{opacity:0;transform:translate(0,0)}14%{opacity:.95}78%{opacity:.95}100%{opacity:0;transform:translate(-120px,10px)}}
    .bar{animation:draw 520ms cubic-bezier(0.23, 1, 0.32, 1) 80ms both}
    .ey{--d:8px;animation:rise 460ms cubic-bezier(0.23, 1, 0.32, 1) 170ms both}
    .nm{--d:14px;animation:rise 540ms cubic-bezier(0.23, 1, 0.32, 1) 240ms both}
    .sb{--d:10px;animation:rise 500ms cubic-bezier(0.23, 1, 0.32, 1) 330ms both}
    .pl0{--d:10px;animation:rise 440ms cubic-bezier(0.23, 1, 0.32, 1) 430ms both}
    .pl1{--d:10px;animation:rise 440ms cubic-bezier(0.23, 1, 0.32, 1) 485ms both}
    .pl2{--d:10px;animation:rise 440ms cubic-bezier(0.23, 1, 0.32, 1) 540ms both}
    .pl3{--d:10px;animation:rise 440ms cubic-bezier(0.23, 1, 0.32, 1) 595ms both}
    .rings{animation:fade 900ms ease-out 560ms both}
    .edges{animation:fade 900ms ease-out 640ms both}
    .nd0{animation:fade 620ms ease-out 700ms both}
    .nd1{animation:fade 620ms ease-out 760ms both}
    .nd2{animation:fade 620ms ease-out 820ms both}
    .nd3{animation:fade 620ms ease-out 880ms both}
    .nd4{animation:fade 620ms ease-out 940ms both}
    .nd5{animation:fade 620ms ease-out 1000ms both}
    .nd6{animation:fade 620ms ease-out 1060ms both}
    .hub{animation:fade 620ms ease-out 680ms both}
    .sweep{stroke-dasharray:74 541.8;animation:sweep 7.0s linear 1.20s infinite both}
    .pk0{animation:pk0 3.6s linear 0.56s infinite both}
    .pk1{animation:pk1 4.2s linear 1.66s infinite both}
    .pk2{animation:pk2 3.9s linear 2.56s infinite both}
    .pk3{animation:pk3 4.6s linear 3.46s infinite both}
    @media (prefers-reduced-motion: reduce) {
      .bar,.ey,.nm,.sb,[class^="pl"],.rings,.edges,.hub,[class^="nd"]
        {animation:fade 320ms ease-out both!important;
         transform:none!important;clip-path:none!important}
      .sweep,[class^="pk"]{display:none}
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="252" fill="url(#bg)"/>
    <ellipse cx="872" cy="126" rx="262" ry="196" fill="url(#glow)"/>
    <g mask="url(#fademask)">
      <g transform="translate(856,122)">
      <g class="rings">
        <circle r="58" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.20"/>
        <circle r="98" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.20"/>
        <circle r="138" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.20"/>
        <circle class="sweep" r="98" fill="none" stroke="#1293AC" stroke-width="1.3" stroke-linecap="round" opacity="0.60"/>
      </g>
      <g class="edges">
        <line x1="0" y1="0" x2="-104" y2="-56" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="82" y2="-68" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="110" y2="24" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="24" y2="86" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="-84" y2="64" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="96" y2="94" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="0" y1="0" x2="-120" y2="10" stroke="url(#accent)" stroke-width="1" opacity="0.45"/>
        <line x1="-104" y1="-56" x2="-84" y2="64" stroke="url(#accent)" stroke-width="1" opacity="0.24"/>
        <line x1="82" y1="-68" x2="110" y2="24" stroke="url(#accent)" stroke-width="1" opacity="0.24"/>
        <line x1="24" y1="86" x2="96" y2="94" stroke="url(#accent)" stroke-width="1" opacity="0.24"/>
      </g>
      <g class="nd0"><circle cx="-104" cy="-56" r="2.8" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd1"><circle cx="82" cy="-68" r="3.4" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd2"><circle cx="110" cy="24" r="2.5" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd3"><circle cx="24" cy="86" r="3.0" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd4"><circle cx="-84" cy="64" r="2.6" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd5"><circle cx="96" cy="94" r="2.1" fill="url(#accent)" opacity="0.88"/></g>
      <g class="nd6"><circle cx="-120" cy="10" r="2.2" fill="url(#accent)" opacity="0.88"/></g>
      <circle class="pk0" r="2.6" fill="#1293AC"/>
      <circle class="pk1" r="2.6" fill="#1293AC"/>
      <circle class="pk2" r="2.6" fill="#1293AC"/>
      <circle class="pk3" r="2.6" fill="#1293AC"/>
      <g class="hub"><circle r="9" fill="url(#accent)" opacity="0.28"/><circle r="4.5" fill="url(#accent)"/></g>
      </g>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="999" height="251" rx="14" fill="none" stroke="#D5DCE3" stroke-width="1"/>

  <rect class="bar" x="56" y="41" width="3" height="81" rx="1.5" fill="url(#accent)"/>
  <text class="ey" x="82" y="58" textLength="349.3" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="600" fill="#5B6570">SENIOR IT INFRASTRUCTURE ENGINEER</text>
  <text class="nm" x="82" y="120" textLength="377.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="56.0" font-weight="700" fill="#0B1117">YAMEEN BUX</text>
  <text class="sb" x="82" y="154" textLength="503.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="18.5" font-weight="400" fill="#454E58">Cloud &amp; DevOps — production systems, shipped and running</text>
  <g class="pl0"><rect x="82" y="178" width="161.2" height="36" rx="18.0" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1"/><text x="98" y="201.5" textLength="129.2" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#2A323B">Cloudflare Workers</text></g>
  <g class="pl1"><rect x="252.192529296875" y="178" width="132.6" height="36" rx="18.0" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1"/><text x="268.192529296875" y="201.5" textLength="100.6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#2A323B">GitHub Actions</text></g>
  <g class="pl2"><rect x="393.79931640625" y="178" width="108.0" height="36" rx="18.0" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1"/><text x="409.79931640625" y="201.5" textLength="76.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#2A323B">PowerShell</text></g>
  <g class="pl3"><rect x="510.841845703125" y="178" width="122.6" height="36" rx="18.0" fill="#FFFFFF" stroke="#D5DCE3" stroke-width="1"/><text x="526.841845703125" y="201.5" textLength="90.6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" font-weight="500" fill="#2A323B">Microsoft 365</text></g>
</svg>
